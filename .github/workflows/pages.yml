name: pages

# Deploy the documents of two branches to GitHub Pages, one site:
#
#   https://rdf-array.github.io/rdf-array/                        the front page: the branches below
#   https://rdf-array.github.io/rdf-array/docs/html-index.html    the rdf-sequences branch, the main line, at the root
#   https://rdf-array.github.io/rdf-array/docs/rdf-array.html
#   https://rdf-array.github.io/rdf-array/docs/owl-array.html
#   https://rdf-array.github.io/rdf-array/docs/owl-direct-semantics-array.html
#   https://rdf-array.github.io/rdf-array/examples/fhir/          (README.md rendered as index.html)
#   https://rdf-array.github.io/rdf-array/management/repos.html   (rendered from repos.json in the browser)
#   https://rdf-array.github.io/rdf-array/vocab/owl-array.ttl     (an ontology IRI: the root does not move)
#   https://rdf-array.github.io/rdf-array/rdf-undef/              the rdf-undef branch, its whole tree under its name
#   https://rdf-array.github.io/rdf-array/rdf-undef/docs/rdf-undef.html
#   https://rdf-array.github.io/rdf-array/rdf-undef/docs/owl-direct-semantics-undef.html
#
# The tracked trees are the site: each docs/*.md is rendered to its .html by tools/md-to-respec.py
# and committed, as is each examples/*/README.md that has an index.html, so nothing is built here
# beyond the front page and the redirects from the pages' addresses before docs/ and management/.
# docs/html-index.html is hand-written. A push to either branch deploys both, each from its own tip.
# Modelled on shex.js-array's pages.yml.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions" (configure-pages
# with `enablement: true` does it on the first run when the token may).

on:
  push:
    branches: [rdf-sequences, rdf-undef]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rdf-sequences
      - uses: actions/checkout@v7
        with:
          ref: rdf-undef
          path: rdf-undef
      - name: check that the HTML renderings are current, on both branches
        run: |
          for root in . rdf-undef; do (
            cd "$root"
            for src in docs/*.md examples/*/README.md; do
              case "$src" in docs/*) dst="${src%.md}.html";; *) dst="$(dirname "$src")/index.html"; [ -f "$dst" ] || continue;; esac
              if ! python3 tools/md-to-respec.py --check "$src" "$dst"; then
                echo "$root/$dst is out of date: run python3 tools/md-to-respec.py $src $dst on that branch" >&2
                exit 1
              fi
            done
          ) || exit 1; done
      - name: check repos.json and the links into repos.html
        run: python3 tools/manifest-check.py --offline
      - name: the front page
        run: |
          cat > index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>rdf-array</title>
          <style>
            body { margin: 0 auto; max-width: 44em; padding: 2em 1em; font: 16px/1.5 system-ui, sans-serif; color: #222; background: #fff; }
            dt { font-weight: 600; margin-top: 1em; }
            dd { margin: 0.2em 0 0 0; }
            a { color: #0b5394; }
          </style>
          </head>
          <body>
          <h1>rdf-array</h1>
          <p>RDF with one more kind of term, the sequence. The documents of the <a href="https://github.com/rdf-array/rdf-array">rdf-array/rdf-array</a> repository, published from two branches:</p>
          <dl>
            <dt><a href="docs/html-index.html">rdf-sequences</a></dt>
            <dd>The main line: sequences in RDF, SPARQL, ShEx, SHACL, JSON-LD and OWL. Its tree is the root of this site.</dd>
            <dt><a href="rdf-undef/docs/html-index.html">rdf-undef</a></dt>
            <dd>A branch of it in which a position of a sequence may be empty. Its tree is under <code>rdf-undef/</code>.</dd>
          </dl>
          </body>
          </html>
          HTML
      - name: redirect the pages' addresses from before docs/ and management/ (2026-10-27)
        run: |
          redirect() {
            printf '<!DOCTYPE html>\n<meta charset="utf-8">\n<title>Moved to %s</title>\n<link rel="canonical" href="%s">\n<meta http-equiv="refresh" content="0; url=%s">\n<script>location.replace("%s" + location.hash)</script>\n<p>Moved to <a href="%s">%s</a>.</p>\n' "$2" "$2" "$2" "$2" "$2" "$2" > "$1"
          }
          for d in rdf-array json-ld-array shacl-array owl-array; do redirect "$d.html" "docs/$d.html"; done
          redirect protege.html docs/protege-array.html
          redirect html-index.html docs/html-index.html
          redirect repos.html management/repos.html
          redirect docs/owl-array-redline.html owl-direct-semantics-array.html
          redirect docs/owl-array-semantics.html owl-direct-semantics-array.html
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
